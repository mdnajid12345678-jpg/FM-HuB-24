navigation = "2.10.2"
datastore = "1.3.0"
room = "2.8.5"
media3 = "1.11.1"
coil = "3.6.3"
supabase = "3.8.0"
ktor = "3.5.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
