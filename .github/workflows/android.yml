name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest :provider-archive:test :provider-iptv:test assembleDebug

      # Proves the provider build tool works on a clean machine: each provider module is dexed
      # with d8 and packaged as a .fmkp plugin, exactly like a third-party provider would be.
      - name: Build provider plugins
        run: ./gradlew --no-daemon :provider-archive:buildPlugin :provider-iptv:buildPlugin

      - name: Upload provider plugins
        uses: actions/upload-artifact@v7
        with:
          name: fmhub24-provider-plugins
          path: |
            provider-archive/build/plugin/*.fmkp
            provider-iptv/build/plugin/*.fmkp
          if-no-files-found: error
          retention-days: 14

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: fmhub24-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
